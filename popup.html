<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpanishDict to Anki Exporter</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #1a1a2e;
        --muted: #6b7280;
        --border: #e5e7eb;
        --ok-bg: #e7f6ec;
        --ok-fg: #1a7f47;
        --err-bg: #fdeaea;
        --err-fg: #b42318;
        --wait-bg: #eef2f7;
        --wait-fg: #475569;
        --accent: #2563eb;
      }

      * { box-sizing: border-box; }

      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      header {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-bottom: 14px;
      }

      h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
      }

      .subtitle {
        font-size: 12px;
        color: var(--muted);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .badge::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
      }

      .badge--checking { background: var(--wait-bg); color: var(--wait-fg); }
      .badge--connected { background: var(--ok-bg); color: var(--ok-fg); }
      .badge--error { background: var(--err-bg); color: var(--err-fg); }

      .detail {
        font-size: 12px;
        color: var(--muted);
        min-height: 16px;
        margin-bottom: 16px;
        line-height: 1.4;
      }

      button {
        width: 100%;
        padding: 10px 12px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        background: var(--border);
        color: var(--muted);
        cursor: not-allowed;
      }

      .retry {
        width: 100%;
        margin-top: 8px;
        padding: 8px;
        background: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .retry[hidden] { display: none; }

      .field { display: block; margin-bottom: 12px; }
      .field[hidden] { display: none; }

      .field-label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        background: #fff;
        color: var(--text);
        cursor: pointer;
      }

      select:disabled {
        background: var(--border);
        color: var(--muted);
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>SpanishDict &rarr; Anki</h1>
      <span class="subtitle">Export vocabulary lists to your Anki desktop</span>
    </header>

    <div id="status-badge" class="badge badge--checking">Checking Anki&hellip;</div>
    <p id="status-detail" class="detail"></p>

    <label class="field" id="model-field" hidden>
      <span class="field-label">Card type</span>
      <select id="model-select"></select>
    </label>

    <button id="scan-button" disabled>Scan Page</button>
    <p id="scan-result" class="detail"></p>

    <button id="export-button" disabled>Export to Anki</button>
    <p id="export-progress" class="detail"></p>

    <button id="retry-button" class="retry" hidden>Retry connection</button>

    <script type="module" src="popup.js"></script>
  </body>
</html>
